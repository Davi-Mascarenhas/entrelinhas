[package]
name = "entrelinhas"
version = "1.2.0-rc.2"
description = "Um espaço tranquilo para escrever"
authors = ["Bit-Devy"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[features]
# Apenas builds isolados de integração; nunca habilitar nos pacotes publicados.
updater-test = []

[lib]
name = "entrelinhas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "=2.14.1"
semver = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
