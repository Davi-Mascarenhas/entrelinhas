name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'scripts/test-windows*'
      - 'scripts/run-windows-tests.ps1'
      - 'scripts/test-desktop.py'
      - 'scripts/*update*.py'
      - 'scripts/check-windows-subsystem.py'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Prepare Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - run: npm ci
      - name: Frontend checks
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run format:check
      - name: Rust checks on Windows
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --lib --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run package:windows
      - name: Check graphical Windows executable
        run: python scripts/check-windows-subsystem.py src-tauri/target/release/entrelinhas.exe
      - name: Cache compiled Windows dependencies before GUI tests
        uses: actions/cache/save@v4
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Build isolated updater test installers
        run: python scripts/build-update-fixtures.py
      - name: Validate wizard and installed application
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/Entrelinhas_${version}_x64-setup.exe"
          if (-not $installer) { throw 'Instalador não encontrado.' }
          ./scripts/run-windows-tests.ps1 -Installer $installer.FullName
      - name: Prepare downloadable installer and checksum
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/Entrelinhas_${version}_x64-setup.exe"
          New-Item -ItemType Directory artifacts/windows-release -Force | Out-Null
          $name = "Entrelinhas_${version}_x64-setup.exe"
          Copy-Item $installer.FullName "artifacts/windows-release/$name"
          Copy-Item "$($installer.FullName).sig" "artifacts/windows-release/$name.sig"
          $digest = (Get-FileHash "artifacts/windows-release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $name" | Set-Content artifacts/windows-release/SHA256SUMS -Encoding utf8NoBOM
          Copy-Item artifacts/windows/results.json artifacts/windows-release/validation.json
          "Built from ${{ github.sha }} on ${{ runner.os }}" | Set-Content artifacts/windows-release/build.txt
      - name: Upload validated installer
        uses: actions/upload-artifact@v4
        with:
          name: entrelinhas-windows-x64
          path: artifacts/windows-release
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-evidence
          path: |
            artifacts/windows/*.png
            artifacts/windows/*.log
            artifacts/windows/*.json
            artifacts/update-fixtures/build-*.log
            src-tauri/target/release/nsis
          if-no-files-found: warn
